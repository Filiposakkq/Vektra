<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vektra review</title>
    <style>
      /* The extension's palette (extension/src/ui/theme.ts). */
      :root { --bg: #262421; --card: #2f2c29; --line: #45403b; --ink: #1e1c1a; --text: #eeeae5; --muted: #aaa39b; --accent: #2f6fe4; --bar: 52px; --board: min(100vw, 55vh); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; }
      #bar {
        position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 2147483647;
        display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box;
        background: var(--ink); border-bottom: 1px solid var(--line);
      }
      #close { width: 44px; height: 44px; border-radius: 22px; background: none; font-size: 22px; }
      #title { min-width: 0; display: grid; line-height: 1.25; }
      #title b, #title small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #title small { color: var(--muted); }
      main { padding: calc(var(--bar) + 16px) 16px 16px; }
      form { display: flex; gap: 8px; margin-bottom: 12px; }
      input { flex: 1; min-width: 0; font: inherit; border-radius: 9px; padding: 10px 12px; border: 1px solid var(--line); background: var(--ink); color: inherit; }
      form button { border-radius: 9px; padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 650; }
      #status { color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; }
      .game {
        width: 100%; margin-top: 8px; padding: 12px 14px; border-radius: 12px; background: var(--card);
        display: flex; align-items: center; gap: 12px; text-align: left;
      }
      .game .side { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }
      .game .who { flex: 1; min-width: 0; display: grid; }
      .game .who b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .game .who small { color: var(--muted); }
      .game .result { flex: none; padding: 3px 9px; border-radius: 7px; font-size: 13px; font-weight: 650; }
      .older button { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--line); }
      .won { background: #3d5a28; color: #c9eaa8; }
      .lost { background: #5c2620; color: #ffbeb5; }
      .drawn { background: var(--line); color: var(--text); }

      /* The game's board under the bar, the move buttons under it, the analysis panel below. */
      #viewer { position: fixed; inset: var(--bar) 0 auto 0; z-index: 2147483647; background: var(--bg); }
      #viewer[hidden] { display: none; }
      #board {
        position: relative; width: var(--board); height: var(--board); margin: 0 auto;
        display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr);
      }
      #board div { position: relative; }
      #board div.light { background: #ebd9bd; color: #a5805e; }
      #board div.dark { background: #a5805e; color: #ebd9bd; }
      /* The move just played, like Chess.com's yellow squares. */
      #board div.moved { background-image: linear-gradient(rgba(255, 221, 51, 0.5), rgba(255, 221, 51, 0.5)); }
      #board svg.piece { position: absolute; inset: 4%; width: 92%; height: 92%; }
      #board div[data-rank]::before, #board div[data-file]::after { position: absolute; font: 600 calc(var(--board) / 38) system-ui, sans-serif; }
      #board div[data-rank]::before { content: attr(data-rank); top: 2px; left: 3px; }
      #board div[data-file]::after { content: attr(data-file); bottom: 1px; right: 3px; }
      #moves { display: flex; align-items: center; gap: 8px; padding: 6px 12px; height: 36px; }
      #moves span { flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
      #moves button { height: 34px; padding: 0 16px; border-radius: 8px; background: var(--card); }
      #moves #line[aria-pressed="true"] { background: var(--accent); color: #fff; }
      /* The extension's panel floats beside the board; here it fills the screen under it. */
      #vektra-analysis-panel {
        inset: calc(var(--bar) + var(--board) + 48px) 0 0 0 !important; width: auto !important; max-width: none !important;
        max-height: none !important; border-radius: 0 !important; border: 0 !important; box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Finished games from Chess.com's public archive, analysed with the extension's code. -->
    <header id="bar">
      <button id="close" aria-label="Back">←</button>
      <div id="title"><b>Review games</b><small>Finished games from Chess.com</small></div>
    </header>
    <main>
      <form id="search">
        <input id="username" placeholder="Chess.com username" autocapitalize="none" autocomplete="off" required />
        <button>Show games</button>
      </form>
      <p id="status"></p>
      <ul id="games"></ul>
    </main>
    <div id="viewer" hidden>
      <div id="board"></div>
      <div id="moves">
        <button id="back" aria-label="Previous move">◀</button>
        <span id="move"></span>
        <button id="line" aria-pressed="false" title="The engine's best line from here">Line</button>
        <button id="forward" aria-label="Next move">▶</button>
      </div>
    </div>
    <script type="module" src="./review.ts"></script>
  </body>
</html>
