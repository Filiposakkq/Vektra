<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vektra review</title>
    <style>
      /*
       * The app's look (Ui.kt): the extension's palette (extension/src/ui/theme.ts),
       * Roboto at the native sizes and two weights, cards rounded 18px, buttons 12px.
       */
      :root { --bg: #262421; --card: #2f2c29; --line: #45403b; --ink: #1e1c1a; --text: #eeeae5; --muted: #aaa39b; --accent: #2f6fe4; --link: #9dbcff; --bar: 60px; --board: min(100vw, 55vh); }
      body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Roboto, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      b, strong { font-weight: 500; }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; }
      #bar {
        position: fixed; inset: 0 0 auto 0; height: var(--bar); z-index: 2147483647;
        display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box;
        background: var(--bg);
      }
      #close { width: 44px; height: 44px; border-radius: 22px; background: none; font-size: 24px; }
      #title { min-width: 0; display: grid; line-height: 1.25; }
      #title b { font-size: 19px; }
      #title small { font-size: 13px; }
      #title b, #title small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #title small { color: var(--muted); }
      main { padding: calc(var(--bar) + 16px) 16px 16px; }
      form { display: flex; gap: 8px; margin-bottom: 12px; }
      input { flex: 1; min-width: 0; font: inherit; border-radius: 12px; padding: 13px 14px; border: 0; background: var(--card); color: inherit; outline: none; }
      input:focus { box-shadow: 0 0 0 2px var(--accent); }
      form button { border-radius: 12px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 500; }
      #status { color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; }
      .game {
        width: 100%; margin-top: 12px; padding: 16px; border-radius: 18px; background: var(--card);
        display: flex; align-items: center; gap: 12px; text-align: left;
        /* Each card rises in a moment after the one above it (--i, set per card). */
        animation: rise .38s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 35ms);
        transition: transform .15s;
      }
      .game:active, .older button:active, #moves button:active, #line:active { transform: scale(.97); }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
      @media (prefers-reduced-motion: reduce) { .game { animation: none; } }
      .game .side { flex: none; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }
      .game .who { flex: 1; min-width: 0; display: grid; }
      .game .who b { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .game .who small { color: var(--muted); font-size: 13px; }
      .game .result { flex: none; padding: 4px 10px; border-radius: 9px; font-size: 13px; font-weight: 500; }
      .older button { width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--line); font-weight: 500; }
      .won { background: #3d5a28; color: #c9eaa8; }
      .lost { background: #5c2620; color: #ffbeb5; }
      .drawn { background: var(--line); color: var(--text); }

      /* The game's board under the bar, the move buttons under it, the analysis panel below. */
      #viewer { position: fixed; inset: var(--bar) 0 auto 0; z-index: 2147483640; background: var(--bg); }
      #viewer[hidden] { display: none; }
      #board {
        position: relative; width: var(--board); height: var(--board); margin: 0 auto;
        display: grid; grid-template: repeat(8, 1fr) / repeat(8, 1fr);
      }
      #board div { position: relative; }
      #board div.light { background: #ebd9bd; color: #a5805e; }
      #board div.dark { background: #a5805e; color: #ebd9bd; }
      /* The move just played, like Chess.com's yellow squares. */
      #board div.moved { background-image: linear-gradient(rgba(255, 221, 51, 0.5), rgba(255, 221, 51, 0.5)); }
      #board svg.piece { position: absolute; inset: 4%; width: 92%; height: 92%; }
      #board div[data-rank]::before, #board div[data-file]::after { position: absolute; font: 600 calc(var(--board) / 38) system-ui, sans-serif; }
      #board div[data-rank]::before { content: attr(data-rank); top: 2px; left: 3px; }
      #board div[data-file]::after { content: attr(data-file); bottom: 1px; right: 3px; }
      /* Swipes on the board step through the game; vertical ones still scroll. */
      #board { touch-action: pan-y; }
      /* Under the board: the moves as a strip, the current one on the accent. */
      #moves { display: flex; align-items: center; gap: 6px; padding: 8px 8px; height: 52px; box-sizing: border-box; }
      #moves > button { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--card); font-size: 24px; line-height: 1; transition: transform .15s; }
      #strip { position: relative; flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
      #strip::-webkit-scrollbar { display: none; }
      #strip button {
        flex: none; display: flex; align-items: center; gap: 5px; height: 36px; padding: 0 10px; border-radius: 12px;
        background: var(--card); font-size: 14px; font-variant-numeric: tabular-nums; transition: background .2s, color .2s;
      }
      #strip button.current { background: var(--accent); color: #fff; }
      #line { margin-left: auto; height: 36px; padding: 0 14px; border-radius: 12px; background: var(--card); font-weight: 500; transition: transform .15s, background .2s; }
      #line[aria-pressed="true"] { background: var(--accent); color: #fff; }
      body:not(.viewing) #line { display: none; }
      /*
       * The extension's panel floats beside the board; here it is a sheet
       * under the move strip that slides up over the board (tap or swipe
       * its header).
       */
      :root { --sheet-top: calc(var(--bar) + var(--board) + 52px); }
      body.sheet-open { --sheet-top: calc(var(--bar) + 8px); }
      #vektra-analysis-panel {
        top: var(--sheet-top) !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        z-index: 2147483645 !important;
        width: auto !important; max-width: none !important; max-height: none !important;
        border-radius: 22px 22px 0 0 !important; border: 0 !important; box-shadow: 0 -8px 24px rgba(0, 0, 0, .35) !important;
        transition: top .34s cubic-bezier(.2, .8, .2, 1);
      }
      #vektra-analysis-panel > div:first-child { position: relative; padding-top: 20px !important; touch-action: none; }
      #vektra-analysis-panel > div:first-child::before {
        content: ""; position: absolute; top: 8px; left: 50%; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: var(--line);
      }
      /* Its fold chevron: the sheet slides instead. */
      #vektra-analysis-panel > div:first-child > span:last-child { display: none; }
      /*
       * The panel in the app's look. It sets its styles inline, so these match
       * them by their text: bold weights become medium, corners rounder, the
       * body a little larger for a phone.
       */
      #vektra-analysis-panel, #vektra-analysis-panel * { font-family: Roboto, system-ui, sans-serif !important; }
      #vektra-analysis-panel [style*="650"], #vektra-analysis-panel [style*="700"], #vektra-analysis-panel [style*="750"] { font-weight: 500 !important; }
      #vektra-analysis-panel [style*="border-radius: 9px"] { border-radius: 16px !important; }
      #vektra-analysis-panel button:not([style*="background: none"]) { border-radius: 12px !important; padding: 11px 16px !important; font-size: 15px !important; }
      #vektra-analysis-panel > div:last-child { zoom: 1.08; }
    </style>
  </head>
  <body>
    <!-- Finished games from Chess.com's public archive, analysed with the extension's code. -->
    <header id="bar">
      <button id="close" aria-label="Back">←</button>
      <div id="title"><b>Review games</b><small>Finished games from Chess.com</small></div>
      <button id="line" aria-pressed="false" title="The engine's best line from here">Line</button>
    </header>
    <main>
      <form id="search">
        <input id="username" placeholder="Chess.com username" autocapitalize="none" autocomplete="off" required />
        <button>Show games</button>
      </form>
      <p id="status"></p>
      <ul id="games"></ul>
    </main>
    <div id="viewer" hidden>
      <div id="board"></div>
      <div id="moves">
        <button id="back" aria-label="Previous move">‹</button>
        <div id="strip"></div>
        <button id="forward" aria-label="Next move">›</button>
      </div>
    </div>
    <script type="module" src="./review.ts"></script>
  </body>
</html>
