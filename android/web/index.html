<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vektra overlay</title>
    <style>
      /* Laid over the Chess.com board: an eval strip, then the board itself. */
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      #eval { display: flex; height: 8px; opacity: 0; transition: opacity .2s; }
      #eval.shown { opacity: 0.9; }
      #eval i { display: block; height: 100%; transition: flex-grow .3s ease; }
      #board { display: block; width: 100vw; height: 100vw; }
    </style>
  </head>
  <body>
    <div id="eval"><i id="eval-mine"></i><i id="eval-theirs"></i></div>
    <svg id="board" viewBox="0 0 8 8" aria-hidden="true"></svg>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
